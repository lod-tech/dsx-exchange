image:
  repository: dsx-exchange/dsx-dashboard
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

# HTTP port the dashboard listens on inside the container.
httpPort: 8080

# NATS endpoint (in-namespace service).
natsURL: "nats://nats:4222"

# Subject the CSC event subscriber listens on. ">" observes all account traffic.
eventSubject: ">"

# Drop _INBOX.> reply traffic from the event feed.
dropInboxEvents: true

# SYS-account NKey seed secret (reused from the surveyor identity).
sysNKey:
  secretName: nats-surveyor
  seedKey: seed

# OAuth2 client credentials for the authorized CSC event subscription.
oauth:
  idpURL: "http://event-bus.idp.svc.cluster.local:5556"
  clientID: "dashboard"
  clientSecret: "dashboard-secret"
  scope: "mqtt"

# Public wiring shown in the UI "Connection info" dialog. Set these to the
# externally reachable addresses (gateway/ingress/broker), not in-cluster DNS.
# Defaults match the documented local port-forwards (see the DevOps runbook in
# local/inference-mock/README.md).
connectionInfo:
  # OpenAI-compatible completion API base URL (for an EDN system).
  completionURL: "http://localhost:8081/v1"
  completionModel: "dsx-mock-llm"
  # DSX Flex MQTT broker + OAuth2 token endpoint (for an energy system / ISV).
  mqttURL: "tcp://localhost:1883"
  oauthTokenURL: "http://localhost:5556/token"
  isvClientID: "grid-isv"
  isvClientSecret: "grid-isv-secret"
  isvScope: "mqtt"
  # DSX Flex agent identity (drives the feedback topic names and feed tag).
  flexAgentID: "maxlps"
  flexFeedTag: "ai-factory-main"

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
