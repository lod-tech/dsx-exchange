{{- $image := .Values.image | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsx-dashboard.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsx-dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "dsx-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dsx-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: dashboard
          image: "{{ required "image.repository is required" $image.repository }}:{{ required "image.tag is required" $image.tag }}"
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: DASHBOARD_HTTP_ADDR
              value: ":{{ .Values.httpPort }}"
            - name: DASHBOARD_NATS_URL
              value: {{ .Values.natsURL | quote }}
            - name: DASHBOARD_EVENT_SUBJECT
              value: {{ .Values.eventSubject | quote }}
            - name: DASHBOARD_DROP_INBOX_EVENTS
              value: {{ .Values.dropInboxEvents | quote }}
            - name: DASHBOARD_SYS_NKEY_SEED_FILE
              value: /etc/dsx-dashboard/sys/{{ .Values.sysNKey.seedKey }}
            - name: DASHBOARD_OAUTH_IDP_URL
              value: {{ .Values.oauth.idpURL | quote }}
            - name: DASHBOARD_OAUTH_CLIENT_ID
              value: {{ .Values.oauth.clientID | quote }}
            - name: DASHBOARD_OAUTH_CLIENT_SECRET
              value: {{ .Values.oauth.clientSecret | quote }}
            - name: DASHBOARD_OAUTH_SCOPE
              value: {{ .Values.oauth.scope | quote }}
            # Public wiring advertised to external systems in the UI dialog.
            - name: DASHBOARD_PUBLIC_COMPLETION_URL
              value: {{ .Values.connectionInfo.completionURL | quote }}
            - name: DASHBOARD_PUBLIC_COMPLETION_MODEL
              value: {{ .Values.connectionInfo.completionModel | quote }}
            - name: DASHBOARD_PUBLIC_MQTT_URL
              value: {{ .Values.connectionInfo.mqttURL | quote }}
            - name: DASHBOARD_PUBLIC_OAUTH_TOKEN_URL
              value: {{ .Values.connectionInfo.oauthTokenURL | quote }}
            - name: DASHBOARD_FLEX_ISV_CLIENT_ID
              value: {{ .Values.connectionInfo.isvClientID | quote }}
            - name: DASHBOARD_FLEX_ISV_CLIENT_SECRET
              value: {{ .Values.connectionInfo.isvClientSecret | quote }}
            - name: DASHBOARD_FLEX_ISV_SCOPE
              value: {{ .Values.connectionInfo.isvScope | quote }}
            - name: DASHBOARD_FLEX_AGENT_ID
              value: {{ .Values.connectionInfo.flexAgentID | quote }}
            - name: DASHBOARD_FLEX_FEED_TAG
              value: {{ .Values.connectionInfo.flexFeedTag | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.httpPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: sys-nkey
              mountPath: /etc/dsx-dashboard/sys
              readOnly: true
      volumes:
        - name: sys-nkey
          secret:
            secretName: {{ .Values.sysNKey.secretName }}
            items:
              - key: {{ .Values.sysNKey.seedKey }}
                path: {{ .Values.sysNKey.seedKey }}
