# CSC-specific values
#
# This file contains operator-facing configuration only.
# Internal NATS accounts, mappings, and leaf nodes are auto-generated
# by the nats-event-bus Helm chart based on global.eventBus.clusterType.

# Event Bus Configuration
global:
  eventBus:
    clusterType: csc
    alerts:
      enabled: true
      team: dsx
    grafanaDashboard:
      enabled: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana.com/dashboard-folder: DSX Event Bus
    # List of CPC IDs that will connect as leaves
    cpcIds: ["1", "2"]
    gateway:
      routes:
        mqtt:
          gatewayNamespace: csc-gateway
        natsClient:
          gatewayNamespace: csc-gateway
        natsLeafnode:
          gatewayNamespace: csc-gateway
        mqttMtls:
          gatewayNamespace: csc-gateway

    # Auth permissions for CSC account
    auth:
      permissions:
        oauth2:
          csc-admin:
            subject: "csc-admin@example.com"
            account: "CSC"
          mqtt-client:
            azp: "mqtt-client"
            account: "CSC"
            permissions:
              pub:
                allow: ["test.>", "perf.>", "cpc.*.test.>"]
              sub:
                allow: ["test.>", "perf.>", "cpc.*.test.>"]
          mqtt-publisher:
            azp: "mqtt-publisher"
            account: "CSC"
            permissions:
              pub:
                allow: ["test.>", "perf.>", "cpc.*.test.>"]
              sub:
                allow: ["dummy.>"]
          mqtt-subscriber:
            azp: "mqtt-subscriber"
            account: "CSC"
            permissions:
              pub:
                allow: ["dummy.>"]
              sub:
                allow: ["test.>", "perf.>", "cpc.*.test.>"]
          launchlayer-client:
            azp: "launchlayer-client"
            account: "LaunchLayer"
            permissions:
              pub:
                allow: ["launchlayer.>", "$JS.API.>", "$KV.>", "$OBJ.>", "$O.>", "$JS.ACK.>"]
              sub:
                allow: ["launchlayer.>", "_INBOX.>"]
          # DSX Live Dashboard: read-only observer of all CSC-account traffic.
          dashboard:
            azp: "dashboard"
            account: "CSC"
            permissions:
              pub:
                allow: ["_INBOX.>"]
              sub:
                allow: [">"]
          # Sample external application for the dashboard demo publisher.
          demo-app:
            azp: "demo-app"
            account: "CSC"
            permissions:
              pub:
                allow: ["demo.>", "test.>"]
              sub:
                allow: ["demo.>", "_INBOX.>"]
          # Mock AI inference service acting as the DSX Flex agent: receives load
          # targets from ISVs and publishes power state, breach alerts, telemetry.
          inference:
            azp: "inference"
            account: "CSC"
            permissions:
              pub:
                allow: ["grid.v1.dsx-flex-agent.>", "dsx.inference.>", "_INBOX.>"]
              sub:
                allow: ["grid.v1.isv.*.loadtarget.set", "_INBOX.>"]
          # DSX Flex ISV: publishes grid load target (power cap) commands and may
          # observe power state feedback from the agent.
          grid-isv:
            azp: "grid-isv"
            account: "CSC"
            permissions:
              pub:
                allow: ["grid.v1.isv.>"]
              sub:
                allow: ["grid.v1.dsx-flex-agent.>", "_INBOX.>"]
        mtls:
          mqtt-client:
            identity: "CN=mqtt-client.csc"
            account: "CSC"
            # MQTT persistence uses the server's internal account client.
            permissions:
              pub:
                allow: ["test.>"]
              sub:
                allow: ["test.>"]
        noauth:
          account: "CSC"
